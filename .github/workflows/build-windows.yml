name: Build AXYOM for Windows

# Builds the AXYOM Windows installer from the private source repo and publishes
# it here, together with latest.yml, so installed copies of AXYOM can update.
# Runs only when started by hand (Actions > Build AXYOM for Windows > Run).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit of ferbogar-uk/axyom-v01 to build'
        required: true
        default: 'axyom-redesign-backup'

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out AXYOM source (private, read-only token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ferbogar-uk/axyom-v01
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AXYOM_SOURCE_TOKEN }}
          path: src

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'src/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        working-directory: src
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm run build:tracker-packages
          pnpm --dir packages/extension-sdk run build
          pnpm --dir packages/runtime run build

      - name: Fetch bundled tools (OpenCode, Whisper base)
        # Large binaries kept out of git. Downloaded from their official releases,
        # each checked against a pinned SHA-256. The Whisper turbo model is left out
        # on purpose (Ricardo, 20 Nov 2026: base model only, smaller installer).
        working-directory: src/packages/electron/resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          T=axyom-tools
          W=tmp-tools
          mkdir -p "$T/opencode" "$T/whisper/Release" "$W"
          check() { echo "$2  $1" | sha256sum -c -; }

          gh release download v1.19.5 -R anomalyco/opencode -p opencode-windows-x64.zip -D "$W"
          check "$W/opencode-windows-x64.zip" 09a6e693157f0887e504f2cf4357a8cbddc5ead5d0dffb9a269dcc47c48640f5
          unzip -q -o "$W/opencode-windows-x64.zip" -d "$W/oc"
          cp "$(find "$W/oc" -name opencode.exe | head -1)" "$T/opencode/opencode.exe"
          gh api repos/anomalyco/opencode/contents/LICENSE -H "Accept: application/vnd.github.raw" > "$T/opencode/LICENSE"

          gh release download b5454 -R ggml-org/whisper.cpp -p whisper-bin-x64.zip -D "$W"
          check "$W/whisper-bin-x64.zip" 6ba69e3482d7826214f90a6a9c84ca07782aec1e1d0c6a7c30c994fd5d816ccb
          unzip -q -o "$W/whisper-bin-x64.zip" -d "$W/wh"
          cli="$(find "$W/wh" -name whisper-cli.exe | head -1)"
          cp "$(dirname "$cli")"/* "$T/whisper/Release/"

          curl -fsSL --retry 3 -o "$T/whisper/ggml-base.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          check "$T/whisper/ggml-base.bin" 60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
          curl -fsSL --retry 3 -o "$T/whisper/ggml-silero-v5.1.2.bin" https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
          check "$T/whisper/ggml-silero-v5.1.2.bin" 29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf

          rm -rf "$W"
          test -f "$T/whisper/Release/whisper-cli.exe"
          du -sh "$T"/* && ls "$T/whisper/Release"

      - name: Build the app
        working-directory: src/packages/electron
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
          BUILD_ARCH: x64
        run: |
          pnpm run build
          pnpm run build:extensions
          pnpm run validate:extra-resources

      # electron-builder would tag the release on the source repo's commit, which
      # does not exist here; create the tag and release on this repo first and
      # let electron-builder upload into it.
      - name: Create the release on this repo
        working-directory: src/packages/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version $VERSION"
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main \
              --title "AXYOM $VERSION" --notes "AXYOM $VERSION for Windows (unsigned). Built from ferbogar-uk/axyom-v01 @ ${{ inputs.ref }}."

      - name: Package installer and publish release
        working-directory: src/packages/electron
        env:
          NODE_ENV: production
          BUILD_ARCH: x64
          # Unsigned build: no certificate on this runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ALLOW_UNSIGNED_WINDOWS_BUILD: 'true'
          # Publishes to this repo (package.json build.publish -> ferbogar-uk/axyom-releases).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Keep the installer as a run artifact too
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axyom-windows
          path: |
            src/packages/electron/release/*.exe
            src/packages/electron/release/*.yml
            src/packages/electron/release/*.blockmap
          if-no-files-found: warn
          retention-days: 14
