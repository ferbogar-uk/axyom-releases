name: Build AXYOM for Windows

# Builds the AXYOM Windows installer from the private source repo and publishes
# it here, together with latest.yml, so installed copies of AXYOM can update.
# Runs only when started by hand (Actions > Build AXYOM for Windows > Run).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit of ferbogar-uk/axyom-v01 to build'
        required: true
        default: 'axyom-redesign-backup'

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out AXYOM source (private, read-only token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ferbogar-uk/axyom-v01
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AXYOM_SOURCE_TOKEN }}
          path: src

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'src/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        working-directory: src
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm run build:tracker-packages
          pnpm --dir packages/extension-sdk run build
          pnpm --dir packages/runtime run build

      - name: Build the app
        working-directory: src/packages/electron
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
          BUILD_ARCH: x64
        run: |
          # Bundled local tools (OpenCode CLI, Whisper) are large binaries kept
          # out of git; this installer ships without them.
          mkdir -p resources/axyom-tools
          pnpm run build
          pnpm run build:extensions
          pnpm run validate:extra-resources

      - name: Package installer and publish release
        working-directory: src/packages/electron
        env:
          NODE_ENV: production
          BUILD_ARCH: x64
          # Unsigned build: no certificate on this runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ALLOW_UNSIGNED_WINDOWS_BUILD: 'true'
          # Publishes to this repo (package.json build.publish -> ferbogar-uk/axyom-releases).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Keep the installer as a run artifact too
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axyom-windows
          path: |
            src/packages/electron/release/*.exe
            src/packages/electron/release/*.yml
            src/packages/electron/release/*.blockmap
          if-no-files-found: warn
          retention-days: 14
